<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - Hyunsoo Han</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    {{ partial "nav.html" . }}

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}
    <script src="/js/main.js"></script>
    <script>
        // Ensure calendar initialization runs even if DOMContentLoaded was missed
        if (document.querySelector('.calendar-container')) {
            if (typeof initCalendar === 'function') {
                initCalendar();
            } else {
                document.addEventListener('DOMContentLoaded', function() {
                    initCalendar();
                });
            }
        }
    </script>
</body>
</html>
