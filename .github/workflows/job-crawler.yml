name: AI Job Crawler to Google Calendar

on:
  schedule:
    - cron: '0 0 * * *' # 매일 UTC 00:00 (KST 09:00) 실행
  workflow_dispatch: # 수동 실행 가능

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # processed_jobs.json 업데이트를 위해 필요

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/job_crawler/requirements.txt

    - name: Run Job Crawler
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
      run: |
        cd scripts/job_crawler
        python main.py

    - name: Commit and Push processed_jobs.json
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add processed_jobs.json || echo "No changes to add"
        git commit -m "chore: update processed jobs state" || echo "No changes to commit"
        git push || echo "No changes to push"
