name: AI Job Crawler v2 (Manual/Local Trigger)

on:
  # schedule:
  #   - cron: '0 0 * * *' # 로컬 LLM 연동을 위해 스케줄링 비활성화
  push:
    paths:
      - 'content/job-report/**' # 리포트가 푸시되면 웹사이트 빌드 트리거
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "job-crawler"
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/job_crawler/requirements.txt

    - name: Run Job Crawler
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/scripts/job_crawler
        python scripts/job_crawler/main.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add processed_jobs.json content/job-report/
        # Check if there are changes before committing
        if git diff --staged --quiet; then
          echo "No new jobs or state changes to commit."
        else
          git commit -m "chore: update processed jobs and daily job reports"
          git push origin main
        fi

    # --- Integrated Build & Deploy Steps ---
    
    - name: Install Hugo CLI
      run: |
        HUGO_VERSION=0.124.1
        wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
        && sudo dpkg -i ${{ runner.temp }}/hugo.deb

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v4

    - name: Build with Hugo
      env:
        HUGO_ENVIRONMENT: production
      run: |
        hugo \
          --gc \
          --minify \
          --baseURL "${{ steps.pages.outputs.base_url }}/"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./public

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
